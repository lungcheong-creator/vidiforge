[project]
name = "vidiforge-api"
version = "0.1.0"
description = "AI short-video generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "edge-tts>=6.1.10",
    "faster-whisper>=1.0.0",
    "Pillow>=10.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "tomli>=2.0.1",
    "google-cloud-storage>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]